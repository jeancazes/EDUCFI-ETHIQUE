name: Déploiement FTP (serveur perso)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le code (PHP, JS)
        run: |
          for f in public/api/*.php; do php -l "$f"; done
          node --check public/assets/suivi.js

      - name: Générer la configuration enseignant (hash du mot de passe)
        env:
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}
        run: |
          test -n "$TEACHER_PASSWORD" || { echo "::error::Secret TEACHER_PASSWORD manquant"; exit 1; }
          H=$(printf %s "$TEACHER_PASSWORD" | sha256sum | cut -d' ' -f1)
          printf "<?php define('TEACHER_SHA256', '%s');\n" "$H" > public/api/config.php

      - name: Vérifier les secrets FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ko=0
          for v in FTP_HOST FTP_USER FTP_PASSWORD REMOTE_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Secret manquant ou vide : $v (Settings > Secrets and variables > Actions > Repository secrets)"; ko=1; fi
          done
          exit $ko

      - name: Envoyer par FTP (les données des élèves sont protégées)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.REMOTE_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/api/data/**

      - name: Nettoyer
        if: always()
        run: rm -f public/api/config.php

# Si le serveur FTP refuse le chiffrement : remplacer « protocol: ftps » par « protocol: ftp »
# (mot de passe alors non chiffré : à éviter hors réseau de confiance).
